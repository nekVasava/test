<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background base rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Calculator Shell -->
  <rect x="96" y="76" width="320" height="360" rx="36" fill="#1e293b" stroke="#334155" stroke-width="4" />
  
  <!-- Digital Screen with glow -->
  <rect x="126" y="106" width="260" height="74" rx="18" fill="#090d16" stroke="#10b981" stroke-width="2" />
  <text x="360" y="156" fill="#34d399" font-family="monospace, monospace" font-size="34" font-weight="bold" text-anchor="end">3.14159</text>
  
  <!-- Calculator Keypad Buttons -->
  <!-- Row 1 -->
  <rect x="126" y="200" width="55" height="46" rx="12" fill="#334155" />
  <text x="153" y="232" fill="#94a3b8" font-family="sans-serif" font-size="20" font-weight="600" text-anchor="middle">AC</text>

  <rect x="194" y="200" width="55" height="46" rx="12" fill="#334155" />
  <text x="221" y="232" fill="#94a3b8" font-family="sans-serif" font-size="20" font-weight="600" text-anchor="middle">±</text>

  <rect x="262" y="200" width="55" height="46" rx="12" fill="#334155" />
  <text x="289" y="232" fill="#94a3b8" font-family="sans-serif" font-size="20" font-weight="600" text-anchor="middle">%</text>

  <rect x="331" y="200" width="55" height="46" rx="12" fill="url(#accentGrad)" />
  <text x="358" y="231" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <rect x="126" y="258" width="55" height="46" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="153" y="289" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">7</text>

  <rect x="194" y="258" width="55" height="46" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="221" y="289" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">8</text>

  <rect x="262" y="258" width="55" height="46" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="289" y="289" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">9</text>

  <rect x="331" y="258" width="55" height="46" rx="12" fill="url(#accentGrad)" />
  <text x="358" y="289" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">×</text>

  <!-- Row 3 -->
  <rect x="126" y="316" width="55" height="46" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="153" y="347" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">4</text>

  <rect x="194" y="316" width="55" height="46" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="221" y="347" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">5</text>

  <rect x="262" y="316" width="55" height="46" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="289" y="347" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">6</text>

  <rect x="331" y="316" width="55" height="46" rx="12" fill="url(#accentGrad)" />
  <text x="358" y="346" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">−</text>

  <!-- Row 4 -->
  <rect x="126" y="374" width="123" height="46" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="187" y="405" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">0</text>

  <rect x="262" y="374" width="55" height="46" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="289" y="405" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">.</text>

  <rect x="331" y="374" width="55" height="46" rx="12" fill="url(#accentGrad)" />
  <text x="358" y="404" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">=</text>
</svg>
